<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOLYFORSCHOOL - الكود جاهز للنسخ</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 15px;
            padding: 50px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
            max-width: 800px;
            width: 100%;
        }

        h1 {
            color: #1e3c72;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
        }

        .code-container {
            background: #f8f9fa;
            border: 3px solid #2a5298;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 25px;
            overflow-x: auto;
        }

        .code-container code {
            font-family: 'Courier New', monospace;
            color: #1e3c72;
            font-size: 1em;
            line-height: 1.8;
            display: block;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .copy-btn {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1.1em;
            transition: all 0.3s;
            width: 100%;
            font-weight: bold;
        }

        .copy-btn:hover {
            transform: scale(1.03);
            box-shadow: 0 8px 20px rgba(42, 82, 152, 0.4);
        }

        .copy-btn:active {
            transform: scale(0.97);
        }

        .copy-feedback {
            color: #27ae60;
            font-size: 1.1em;
            margin-top: 15px;
            display: none;
            text-align: center;
            font-weight: bold;
        }

        .copy-feedback.show {
            display: block;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 1.8em;
            }

            .container {
                padding: 30px;
            }

            .code-container code {
                font-size: 0.9em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📋 الكود جاهز للنسخ</h1>
        
        <div class="code-container">
            <code id="codeContent">&lt;!DOCTYPE html&gt;
&lt;html dir="rtl" lang="ar"&gt;
    &lt;head&gt;
        &lt;title&gt; 1-2&lt;/title&gt;
        &lt;meta charset="UTF-8" /&gt;
    &lt;/head&gt;
    &lt;body&gt;
        &lt;mark&gt;&lt;/mark&gt;
    &lt;/body&gt;
&lt;/html&gt;</code>
        </div>
        
        <button class="copy-btn" onclick="copyCode()">📋 نسخ الكود</button>
        <div class="copy-feedback" id="copyFeedback">✅ تم النسخ بنجاح!</div>
    </div>

    <script>
        function copyCode() {
            const codeElement = document.getElementById('codeContent');
            const text = codeElement.innerText;
            
            navigator.clipboard.writeText(text).then(() => {
                const feedback = document.getElementById('copyFeedback');
                feedback.classList.add('show');
                setTimeout(() => {
                    feedback.classList.remove('show');
                }, 2000);
            }).catch(err => {
                alert('حدث خطأ في النسخ');
            });
        }
    </script>
</body>
</html>
